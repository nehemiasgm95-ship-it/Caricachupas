name: Android

# APK de prueba (para instalar en tu teléfono) y paquete AAB firmado (para Google Play).
on:
  workflow_dispatch:
    inputs:
      tipo:
        description: "debug = APK de prueba · release = AAB firmado para Google Play · release-smoke = prueba del flujo de tienda con llave temporal (no sirve para Play)"
        type: choice
        options: [debug, release, release-smoke]
        default: debug
  push:
    branches: [main]
    paths:
      - "android/**"
      - "native/**"
      - "app.js"
      - "index.html"
      - "style.css"
      - "config.js"
      - "package.json"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias y correr pruebas
        run: |
          npm ci
          npm test

      - name: Asegurar plataforma Android 36
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null || true

      - name: Preparar la web y sincronizar con Android
        run: |
          echo "VERSION_NAME=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
          npm run sync

      - name: APK de prueba
        if: ${{ github.event.inputs.tipo != 'release' && github.event.inputs.tipo != 'release-smoke' }}
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Datos del APK (paquete, versión de destino, permisos)
        if: ${{ github.event.inputs.tipo != 'release' && github.event.inputs.tipo != 'release-smoke' }}
        run: |
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT2" dump badging android/app/build/outputs/apk/debug/app-debug.apk | grep -E "^(package|sdkVersion|targetSdkVersion|application-label:|launchable-activity)|uses-permission" | tee apk-info.txt
          { echo '### Datos del APK'; echo '```'; cat apk-info.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Subir APK de prueba
        if: ${{ github.event.inputs.tipo != 'release' && github.event.inputs.tipo != 'release-smoke' }}
        uses: actions/upload-artifact@v4
        with:
          name: caricachupas-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Revisar que no queden pruebas ni borradores
        if: ${{ github.event.inputs.tipo == 'release' }}
        run: npm run check:release

      - name: Preparar llave de subida
        if: ${{ github.event.inputs.tipo == 'release' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::Falta el secreto ANDROID_KEYSTORE_BASE64 (ver ANDROID.md)"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: AAB firmado para Google Play
        if: ${{ github.event.inputs.tipo == 'release' }}
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Subir AAB
        if: ${{ github.event.inputs.tipo == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: caricachupas-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      # --- Prueba de humo del flujo de tienda: llave temporal que se descarta. El AAB resultante NO sirve para Google Play.
      - name: Llave temporal (solo prueba de humo)
        if: ${{ github.event.inputs.tipo == 'release-smoke' }}
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/smoke.jks" -alias smoke -keyalg RSA -keysize 2048 -validity 2 \
            -storepass smokepass -keypass smokepass -dname "CN=smoke"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/smoke.jks" >> "$GITHUB_ENV"

      - name: AAB de prueba de humo
        if: ${{ github.event.inputs.tipo == 'release-smoke' }}
        working-directory: android
        env:
          KEYSTORE_PASSWORD: smokepass
          KEY_ALIAS: smoke
          KEY_PASSWORD: smokepass
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon --stacktrace
          ls -la app/build/outputs/bundle/release/
          jarsigner -verify -verbose:summary app/build/outputs/bundle/release/app-release.aab | tail -3
